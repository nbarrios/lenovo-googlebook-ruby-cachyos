# Installed by tools/install_ruby_sensors.sh.
# The firmware's ACPI ambient light sensor (acpi-als) always reads 0; the real
# sensor is cros-ec-light on the sensor hub. acpi-als registers first and is the
# only one with in_illuminance_raw, so tools that take the first light sensor
# (Noctalia's als-brightness plugin) would read it and see a dark room.
blacklist acpi_als
