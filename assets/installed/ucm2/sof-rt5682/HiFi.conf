SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		# The tas2781 driver starts with no DSP configuration selected
		# (-1) and the amps stay silent. Config 0 is playback; config 1
		# is calibration (factory TAS2563.xml, calibration_config_id 1).
		cset "name='Speaker Program Id' 0"
		cset "name='Speaker Config Id' 0"
		cset "name='Speaker Profile Id' 0"
		cset "name='Spk Switch' on"
	]
	DisableSequence [
		cset "name='Spk Switch' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' on"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' off"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' off"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "DAC1"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"
	EnableSequence [
		cset "name='Dmic0 Capture Switch' on,on,on,on"
	]
	DisableSequence [
		cset "name='Dmic0 Capture Switch' off,off,off,off"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},99"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"
	EnableSequence [
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		JackControl "Headset Mic Jack"
	}
}

SectionDevice."HDMI1" {
	Comment "HDMI/DisplayPort 1"
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},5"
		JackControl "HDMI/DP,pcm=5 Jack"
	}
}

SectionDevice."HDMI2" {
	Comment "HDMI/DisplayPort 2"
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},6"
		JackControl "HDMI/DP,pcm=6 Jack"
	}
}

SectionDevice."HDMI3" {
	Comment "HDMI/DisplayPort 3"
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},7"
		JackControl "HDMI/DP,pcm=7 Jack"
	}
}
