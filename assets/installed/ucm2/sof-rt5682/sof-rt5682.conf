Syntax 7

# Lenovo Googlebook 15 (Ruby): SOF + RT5682S headset codec + 4x TAS2563 amps.
# Converted from the factory CRAS config (vendor/etc/audio/
# sof-rt5682_alc5682ivs_tas2563/{audio_config,mixer_paths}.xml).

SectionUseCase."HiFi" {
	File "/conf.d/sof-rt5682/HiFi.conf"
	Comment "Play HiFi quality Music"
}

BootSequence [
	cset "name='Headphone Jack Switch' off"
	cset "name='Stereo1 DAC MIXL DAC L1 Switch' off"
	cset "name='Stereo1 DAC MIXR DAC R1 Switch' off"
	cset "name='Stereo1 ADC L Mux' 0"
	cset "name='STO1 ADC Capture Switch' on,on"
	cset "name='RECMIX1L CBJ Switch' on"
	cset "name='IF1 01 ADC Swap Mux' 2"
	cset "name='CBJ Boost Volume' 16"
	cset "name='Dmic0 Capture Volume' 44,44"
	cset "name='Stereo1 ADC L1 Mux' 1"
	cset "name='Stereo1 ADC R1 Mux' 1"
	cset "name='Stereo1 ADC MIXL ADC2 Switch' off"
	cset "name='Stereo1 ADC MIXR ADC2 Switch' off"
	cset "name='Stereo1 ADC MIXL ADC1 Switch' on"
	cset "name='Stereo1 ADC MIXR ADC1 Switch' on"
	cset "name='DAC1 Playback Volume' 122,122"
	cset "name='Dmic0 Capture Switch' off,off,off,off"
	cset "name='Headset Mic Switch' off"
	cset "name='Spk Switch' off"
]
