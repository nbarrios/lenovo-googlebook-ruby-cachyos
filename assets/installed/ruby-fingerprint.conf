# Installed by tools/install_fingerprint_driver.sh.
# Stops udev from autoloading cros_ec_usb for the fingerprint MCU (18d1:5402)
# until it has been tested by hand; `modprobe cros_ec_usb` still loads it.
# Remove this file (or rerun the installer with --autoload) to load it at boot.
blacklist cros_ec_usb
