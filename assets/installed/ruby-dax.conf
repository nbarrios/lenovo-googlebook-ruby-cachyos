# Use the factory Ruby SOF firmware (built-in Dolby DAX module) and topology
# (dolby-dax pipelines), as Googlebook OS's mod_options --sof-fw does.
# Remove this file to fall back to the stock sof-firmware files.
options snd_sof_pci fw_path=intel/sof-ipc4/ptl/ruby tplg_path=intel/sof-ipc4-tplg/ruby
