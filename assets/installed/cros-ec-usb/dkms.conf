# ChromeOS EC over USB (Google FPMCU 18d1:5402 on the Googlebook 15 "Ruby").
# Installed by tools/install_fingerprint_driver.sh to /usr/src/cros-ec-usb-<version>/.
#
# Sources, unmodified (GPL-2.0, Google LLC; see their SPDX lines):
#   cros_ec_usb.c  "[PATCH v6] platform/chrome: Add ChromeOS EC USB driver",
#                  Dawid Niedzwiecki, 12 Sep 2025, lore Message-Id
#                  <20250912065104.260344-1-dawidn@google.com>,
#                  https://patchwork.kernel.org/patch/14228232/ ; identical to
#                  ChromiumOS Gerrit CL 6939126 patchset 3 (revision
#                  b1b109a0db328a1bccbe426f9a32c783528bec43).
#                  sha256 c656d58f85646e668e62a484125609fcfc0850eb0e26ea599cafc1277480f8ed
#   cros_ec.h      drivers/platform/chrome/cros_ec.h at torvalds/linux tag v7.2
#                  (private header, absent from linux-cachyos-headers).
#                  sha256 cc0c057058e579a14670781ebc347742c5ca0da427e0530903f26529fa7af8ec
# Local patches, applied by DKMS with patch -p1 in the build copy:
#   0001  port to the Linux >= 6.18 cros_ec core (buffers, lock, notifiers)
#   0002  unregister the EC and free state on module unload (rmmod safety)
#
# Version: LKML v6, local revision 1. Bump it (new /usr/src directory) when
# the patches change.
PACKAGE_NAME="cros-ec-usb"
PACKAGE_VERSION="6.1"

BUILT_MODULE_NAME[0]="cros_ec_usb"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"

PATCH[0]="0001-port-to-linux-6.18-cros-ec-core.patch"
PATCH[1]="0002-unregister-ec-on-module-unload.patch"

# Patch 0001 targets the cros_ec core API introduced in 6.18.
BUILD_EXCLUSIVE_KERNEL_MIN="6.18"
