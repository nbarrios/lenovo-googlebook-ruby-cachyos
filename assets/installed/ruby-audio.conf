# Ruby: RT5682S headset codec + TAS2563 amplifiers on I2S need the SOF driver
# (topology sof-ptl-tas2563-rt5682.tplg). dspcfg auto-detection picks legacy
# HDA on this board, which only exposes HDMI/DP audio.
options snd_intel_dspcfg dsp_driver=3
# Loaded explicitly by ruby-gpu.service after Xe.
blacklist snd_sof_pci_intel_ptl
# No NHLT ACPI table on this board, so the 4 DMICs are not auto-detected;
# Googlebook OS sets the same (vendor_dlkm modules.options).
options snd_sof_intel_hda_generic dmic_num=4
