# Ruby internal microphones: the 4 DMICs are rated -26 dBFS at 94 dB SPL, so
# normal speech arrives near -60 dBFS and the SOF capture gain tops out at
# 0 dB. Googlebook OS added gain in software; this virtual source adds a fixed
# +36 dB after an 80 Hz high-pass (the factory DSP ran a DC blocker). The
# builtin linear plugin clamps Mult to 10 (+20 dB), hence two stages.
# Priority sits above the raw internal mic (160) and below a plugged-in
# headset mic (2000), so headsets still take over.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Internal Microphone"
            media.name       = "Internal Microphone"
            filter.graph = {
                nodes = [
                    { type = builtin name = hp   label = bq_highpass control = { "Freq" = 80.0 } }
                    { type = builtin name = g1   label = linear      control = { "Mult" = 10.0 "Add" = 0.0 } }
                    { type = builtin name = g2   label = linear      control = { "Mult" = 6.31 "Add" = 0.0 } }
                ]
                links = [
                    { output = "hp:Out" input = "g1:In" }
                    { output = "g1:Out" input = "g2:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "ruby_mic.raw"
                node.passive   = true
                target.object  = "alsa_input.pci-0000_00_1f.3-platform-ptl_rt5682_def.HiFi__Mic__source"
                stream.dont-remix = true
            }
            playback.props = {
                node.name        = "ruby_mic"
                media.class      = Audio/Source
                priority.session = 1500
            }
        }
    }
]
